<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Marquee One Piece</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fff;
    }
    .marquee {
      width: 100%;
      overflow: hidden;
      background: #1e1e2f;
      color: #ffffff;
      font-size: 22px;
      padding: 15px 0;
      white-space: nowrap;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .marquee-text {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 12s linear infinite;
    }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <div class="marquee">
    <div class="marquee-text">
      🌊 Selamat datang di Dunia One Piece! ☠️ Ikuti petualangan kru Topi Jerami! ⚓️ Jangan lewatkan aksi serunya setiap hari!
    </div>
  </div>
</body>
</html>
